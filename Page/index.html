<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>開啟 App</title>

  <!-- iOS Smart App Banner -->
  <meta name="apple-itunes-app"
        content="app-id=1234567890, app-argument=https://bryanjhuo.github.io/Page">

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif; margin:0; background:#f7f7f8; }
    .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { width:100%; max-width:520px; background:#fff; border-radius:16px; padding:28px;
            box-shadow:0 10px 30px rgba(0,0,0,0.08); text-align:center; }
    h1 { font-size:20px; margin-bottom:12px; }
    .btn { display:inline-block; padding:14px 16px; border-radius:12px; font-weight:600; text-decoration:none;
           border:1px solid #e0e7ff; background:#eef2ff; }
    .muted { color:#666; font-size:13px; margin-top:12px; }
    .btns { display:grid; gap:12px; margin-top:16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>開啟 App</h1>
      <!-- 這裡用 Universal Link -->
      <a class="btn" href="https://bryanjhuo.github.io/Page">在 App 中開啟</a>

      <div class="btns">
        <a class="btn" href="https://apps.apple.com/app/id1234567890">前往 App Store（iOS）</a>
        <a class="btn" href="https://play.google.com/store/apps/details?id=com.example.myapp">前往 Google Play（Android）</a>
      </div>

      <p class="muted">若已安裝 App → 會直接進 App<br>未安裝 → 保持在此網頁，可手動下載</p>
    </div>
  </div>
</body>
</html>
